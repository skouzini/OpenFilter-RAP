[project]
name = "openfilter-poc"
version = "0.1.0"
description = "Real-Time Annotated Pipeline: an OpenFilter proof-of-concept"
requires-python = ">=3.10"
dependencies = [
    "openfilter[all]",
    "ultralytics",
    "pyvirtualcam",
    "streamlit",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["filters", "pipelines"]
